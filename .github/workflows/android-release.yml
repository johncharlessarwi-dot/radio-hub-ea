name: Signed Android APK Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
      APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
      APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
      APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VITE_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::VITE_API_BASE_URL repository variable must be a real HTTPS backend URL"
            exit 1
          fi
          for key in APK_KEYSTORE_BASE64 APK_KEYSTORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Required Android signing secret is missing: $key"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install JavaScript dependencies
        run: npm install
      - name: Verify TypeScript and tests
        run: |
          npm run lint
          npm run typecheck
          npm run test
      - name: Build and initialize Capacitor Android
        run: |
          npm run build -w @redio/web
          cd apps/web
          npx cap add android
          npx cap sync android
          npm run android:native
      - name: Compile unsigned release APK
        working-directory: apps/web/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/redio-release.jks"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          unsigned="apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          mkdir -p release
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/redio-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/redio-release.jks" \
            --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass env:APK_KEYSTORE_PASSWORD \
            --key-pass env:APK_KEY_PASSWORD \
            --out "release/redio-hub-ea-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/redio-aligned.apk"
          "$build_tools/apksigner" verify --verbose "release/redio-hub-ea-${GITHUB_REF_NAME}.apk"
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/redio-release.jks" "$RUNNER_TEMP/redio-aligned.apk"
      - name: Publish signed artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS.txt --verify-tag --generate-notes --title "REDIO HUB EA $GITHUB_REF_NAME"
