name: Android Build Verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install project dependencies
        run: npm install
      - name: Build web assets
        run: npm run build -w @redio/web
      - name: Generate and sync Android project
        working-directory: apps/web
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile Android debug APK (unsigned test artifact)
        working-directory: apps/web/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Verify APK output
        run: test -s apps/web/android/app/build/outputs/apk/debug/app-debug.apk
