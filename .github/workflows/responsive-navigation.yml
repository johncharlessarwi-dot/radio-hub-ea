name: Responsive navigation
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/responsive-navigation.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --workspace @redio/web --include-workspace-root --no-audit
      - run: npm run build -w @redio/web
      - run: python -m pip install playwright==1.55.0
      - name: Navigate on phone, tablet and desktop
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory apps/web/dist >/tmp/navigation-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --silent --fail --retry 5 --retry-connrefused http://127.0.0.1:4173/ >/dev/null
          python - <<'PY'
          from playwright.sync_api import sync_playwright, expect

          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path="/usr/bin/google-chrome")
              for width, height in [(320,568),(360,800),(390,844),(430,932),(667,375),(844,390),(768,1024),(1440,900)]:
                  page = browser.new_page(viewport={"width":width, "height":height}, reduced_motion="reduce")
                  page.goto("http://127.0.0.1:4173/", wait_until="domcontentloaded")
                  mobile = page.locator(".mobile-nav")
                  if width <= 700:
                      expect(mobile).to_be_visible()
                      for index in [2, 1, 0]:
                          button = mobile.get_by_role("button").nth(index)
                          button.click()
                          expect(button).to_have_attribute("aria-current", "page")
                  else:
                      for index in [1, 0]:
                          button = page.locator("nav.tabs button").nth(index)
                          button.click()
                          expect(button).to_have_class("selected")
                  print(f"Passed navigation at {width}x{height}", flush=True)
                  page.close()
              browser.close()
          PY
